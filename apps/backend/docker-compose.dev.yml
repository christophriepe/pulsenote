# Live-editing override: mounts the sources instead of using the copies in the image.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Changes to Questionnaires need a restart (they are loaded at startup);
# preview.html is served fresh on every request.
services:
  backend:
    volumes:
      - ./app:/app/app
      - ../../packages/form-definitions:/app/form-definitions
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
