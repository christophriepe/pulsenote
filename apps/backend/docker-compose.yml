# Run from this folder: docker compose up -d --build
name: pulsenote
services:
  backend:
    container_name: pulsenote_backend
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${APP_PORT:-8014}:8000"
    volumes:
      # Cases are stored on the host in apps/backend/data (ignored by git)
      - ./data:/data
    restart: unless-stopped
    # Default: self-contained image (app/, apps/web and packages/form-definitions are copied in).
    # For live editing add docker-compose.dev.yml (see README).
