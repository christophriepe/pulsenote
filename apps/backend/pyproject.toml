[project]
name = "pulsenote-backend"
version = "0.1.0"
description = "PulseNote backend: case store for FHIR QuestionnaireResponses (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fhir-resources>=8.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
